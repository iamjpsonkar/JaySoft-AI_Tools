[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsat"
version = "0.1.8"
description = "Codebase intelligence shell and SDK — index once, query forever, works with Claude, GPT, Ollama, and any AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jay Prakash Sonkar", email = "iamjpsonkar@gmail.com" },
]
maintainers = [
    { name = "Jay Prakash Sonkar", email = "iamjpsonkar@gmail.com" },
]
keywords = [
    "codebase", "intelligence", "ai", "mcp", "llm", "claude", "ollama",
    "sdk", "cli", "static-analysis", "developer-tools", "graph", "tree-sitter",
    "blast-radius", "security", "incident-investigation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "pydantic-settings>=2",
    "structlog>=24",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-go>=0.21",
    "sqlean.py>=0.21.7",
    "pyyaml>=6",
    "gitpython>=3.1",
    "httpx>=0.27",
    "psutil>=5.9",
    "click>=8",
]

[project.optional-dependencies]
local = [
    "ollama>=0.2",
]
standard = [
    "semgrep>=1.50",
    "openapi-spec-validator>=0.7",
    "prance>=23",
    "jsonschema>=4.20",
    "tree-sitter-java>=0.21",
    "tree-sitter-ruby>=0.21",
    "tree-sitter-rust>=0.21",
]
team = [
    "jsat[standard]",
    "neo4j>=5.15",
    "qdrant-client>=1.7",
    "redis>=5",
    "graphiti-core>=0.3",
]
anthropic = [
    "anthropic>=0.30",
]
openai = [
    "openai>=1.35",
]
ci = [
    "jsat[standard]",
    "pygithub>=2",
    "sarif-tools>=0.3",
]
all = [
    "jsat[local]",
    "jsat[team]",
    "jsat[anthropic]",
    "jsat[openai]",
    "jsat[ci]",
]

[project.scripts]
jsat = "jsat.cli:app"

[project.urls]
Homepage = "https://github.com/iamjpsonkar/JaySoft-AI_Tools"
Documentation = "https://iamjpsonkar.github.io/JaySoft-AI_Tools/"
Repository = "https://github.com/iamjpsonkar/JaySoft-AI_Tools"
"Bug Tracker" = "https://github.com/iamjpsonkar/JaySoft-AI_Tools/issues"
Changelog = "https://github.com/iamjpsonkar/JaySoft-AI_Tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["jsat"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (Neo4j, Qdrant, Redis)",
    "slow: test takes more than 5 seconds",
    "ci: safe to run in CI with no external services or API keys",
]

[tool.coverage.run]
source = ["jsat"]
omit = [
    "jsat/_graph/neo4j.py",
    "jsat/_cache/redis.py",
    "jsat/tools/knowledge.py",
]
