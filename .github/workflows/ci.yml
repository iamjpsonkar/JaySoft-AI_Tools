name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jsat (core only — no heavy optional deps in CI)
        run: |
          pip install --upgrade pip
          pip install -e "."
          pip install pytest pytest-asyncio

      - name: Run CI-safe tests
        run: pytest -m ci --tb=short -q
        env:
          CI: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        # No inline rule list: ruff reads [tool.ruff] from pyproject.toml, so CI
        # enforces exactly what the project declares. The previous permissive
        # override hid 84 real findings in tests/ and never linted tests/ at all.
        run: ruff check jsat/ tests/
