name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build and deploy to gh-pages branch
        run: mkdocs gh-deploy --force --clean
        # mkdocs gh-deploy:
        #   1. Builds static HTML into a temp folder
        #   2. Pushes it to the gh-pages branch (creates it if needed)
        #   3. Automatically adds .nojekyll so GitHub Pages skips Jekyll
        #
        # Then set GitHub Pages to: Settings → Pages → Source:
        #   "Deploy from a branch" → branch: gh-pages → folder: / (root)
