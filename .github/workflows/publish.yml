name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on: git tag v0.1.0 && git push --tags

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jsat/

    permissions:
      id-token: write   # required for trusted publishing (no token needed!)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token needed in secrets!
        # Set up at: pypi.org → Your projects → Publishing → Add publisher
        # Publisher: GitHub Actions, repo: your/repo, workflow: publish.yml
