name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on: git tag v0.1.0 && git push --tags

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jsat/

    permissions:
      id-token: write   # required for trusted publishing (no token needed!)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build tomli

      - name: Validate version tag matches pyproject.toml
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PYPROJECT=$(python -c "
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          echo "Tag version:        $VERSION"
          echo "pyproject version:  $PYPROJECT"
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "❌ Tag $TAG does not match pyproject.toml version $PYPROJECT"
            echo "   Bump pyproject.toml and __init__.py before tagging."
            exit 1
          fi
          echo "✓ Version match: $VERSION"

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true   # don't fail if this version was already uploaded
