site_name: JSAT Docs
site_url: https://iamjpsonkar.github.io/JaySoft-AI-Tools
site_description: JSAT — JaySoft AI Tools. Open-source codebase intelligence shell and SDK.
site_author: Jay Prakash Sonkar

repo_name: iamjpsonkar/JaySoft-AI_Tools
repo_url: https://github.com/iamjpsonkar/JaySoft-AI_Tools
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Claude Integration: claude-integration.md
  - AI Providers: ai-providers.md
  - CLI Reference: cli-reference.md
  - Tools: tools.md
  - Python SDK: sdk.md
  - Configuration: configuration.md
  - Publishing: publishing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iamjpsonkar/JaySoft-AI_Tools
